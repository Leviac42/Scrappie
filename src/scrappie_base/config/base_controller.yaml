base_controller:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    baudrate: 9600
    wheel_separation: 0.50     # meters - distance between wheels
    wheel_radius: 0.1143       # meters - wheel radius
    max_linear_speed: 1.0      # m/s
    max_angular_speed: 2.0     # rad/s
    publish_odom_tf: true
